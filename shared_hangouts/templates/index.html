<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Dates</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
</head>
<body class="{{ theme }}">
  <h1>Welcome Lover</h1>
  <form method="POST" action="/add_date">
    <input type="date" name="date" required>
    <button type="submit">Add Date</button>
  </form>
  <ul>
    {% for id, date_value in dates %}
      <li>{{ date_value }} <a href="/delete_date/{{ id }}">Delete</a></li>
    {% endfor %}
  </ul>
  <select id="themeSelect">
    <option value="red">Red / White</option>
    <option value="pink">Pink / Black</option>
    <option value="lightblue">Light Blue / Black</option>
    <option value="darkblue">Dark Blue / White</option>
    <option value="green">Green / White</option>
    <option value="purple">Purple / White</option>
    <option value="yellow">Yellow / Black</option>
  </select>
</body>
</html>
