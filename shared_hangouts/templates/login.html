<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            background-color: #ffb6c1;
            color: black;
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        input {
            padding: 8px;
            margin: 5px;
            width: 200px;
            text-align: center;
        }

        button {
            background-color: black;
            color: #ffb6c1;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1> Login <3 </h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required><br>
        <input type="password" name="password" placeholder="Password" required><br>
        <button type="submit">Sign In</button>
    </form>

</body>
</html>
