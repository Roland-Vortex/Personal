<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
</head>
<body>

<h1>Welcome lover 💖</h1>

<select onchange="setTheme(this.value)">
<option value="pink">Pink</option>
<option value="red">Red</option>
<option value="lightblue">Light Blue</option>
<option value="darkblue">Dark Blue</option>
<option value="green">Green</option>
<option value="purple">Purple</option>
<option value="yellow">Yellow</option>
</select>

<form method="POST" class="card">
<input name="title" placeholder="Title" required>
<input type="date" name="date" required>
<input type="time" name="time">
<input name="location" placeholder="Location">
<input name="notes" placeholder="Notes">
<button>Add Date</button>
</form>

{% for event in events %}
<div class="card">
<form method="POST" action="/edit/{{event[0]}}">
<input name="title" value="{{event[1]}}">
<input type="date" name="date" value="{{event[2]}}">
<input name="time" value="{{event[3]}}">
<input name="location" value="{{event[4]}}">
<input name="notes" value="{{event[5]}}">
<button>Update</button>
<a href="/delete/{{event[0]}}">Delete</a>
</form>
</div>
{% endfor %}

</body>
</html>
