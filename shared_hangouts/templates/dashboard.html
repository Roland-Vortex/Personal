<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js"></script>
</head>
<body>

<h1>Welcome lover ❤️</h1>

<button onclick="toggleTheme()">Swap Theme</button>
<a href="/logout">Logout</a>

<h2>Add New Plan</h2>

<form method="POST">
    <input type="text" name="title" placeholder="Plan title" required>
    <input type="date" name="date" required>
    <input type="time" name="time" required>
    <textarea name="description" placeholder="Description..." required></textarea>
    <button type="submit">Add Plan</button>
</form>

<hr>

<h2>Your Plans</h2>

{% for plan in plans %}
<div class="card">
    <h3>{{ plan[1] }}</h3>
    <p><strong>Date:</strong> {{ plan[2] }}</p>
    <p><strong>Time:</strong> {{ plan[3] }}</p>
    <p><strong>Description:</strong> {{ plan[4] }}</p>

    <form action="/edit/{{ plan[0] }}" method="POST">
        <input type="text" name="title" value="{{ plan[1] }}" required>
        <input type="date" name="date" value="{{ plan[2] }}" required>
        <input type="time" name="time" value="{{ plan[3] }}" required>
        <textarea name="description" required>{{ plan[4] }}</textarea>
        <button type="submit">Modify</button>
    </form>

    <a href="/delete/{{ plan[0] }}">Delete</a>
</div>
{% endfor %}

</body>
</html>
