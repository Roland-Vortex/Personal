<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Make A Date</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body>
    <h1>Welcome Lover</h1>

    <!-- Theme selector -->
    <select id="theme-select">
        <option value="red-white">Red/White</option>
        <option value="pink-black">Pink/Black</option>
        <option value="lightblue-black">Light Blue/Black</option>
        <option value="darkblue-white">Dark Blue/White</option>
        <option value="green-white">Green/White</option>
        <option value="purple-white">Purple/White</option>
        <option value="yellow-black">Yellow/Black</option>
    </select>

    <form action="/add_date" method="POST">
        <input type="text" name="title" placeholder="Title" required>
        <input type="date" name="date" required>
        <button type="submit">Add Date</button>
    </form>

    <ul>
        {% for d in dates %}
            <li>{{ d[1] }} - {{ d[2] }}
                <form action="/delete_date/{{ d[0] }}" method="POST" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
